name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow runs every check here before it publishes.
  workflow_call:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext jq zip \
            qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript

      - name: Shell script syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          bash -n scripts/hooks/pre-commit

      - name: Validate metadata.json
        run: |
          jq -e '.KPlugin.Id == "net.tropism.plasma.aussieweather"' metadata.json
          jq -e '.KPlugin.Version | test("^[0-9]+\\.[0-9]+")' metadata.json
          jq -e '.KPackageStructure == "Plasma/Applet"' metadata.json

      # The fetch scripts, the JS helpers, the station table and WeatherModel:
      # none needs Plasma. The QML that does is checked by the qml job.
      - name: Run tests
        run: bash scripts/test.sh

      # The icon's copies must be made from today's branding/ sources.
      - name: Icons are current
        run: python3 -I scripts/make-icons.py --check

      # template.pot must list exactly the translatable strings in the code.
      # Order and source locations change whenever code moves between
      # files, so the strings are compared, not the text.
      - name: Translation template is current
        run: |
          cp translate/template.pot "$RUNNER_TEMP/committed.pot"
          bash translate/merge.sh
          python3 -I scripts/check-pot.py "$RUNNER_TEMP/committed.pot" translate/template.pot

      - name: Build .plasmoid
        run: unzip -l "$(bash scripts/package.sh)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plasmoid
          path: net.tropism.plasma.aussieweather-*.plasmoid

  # The fetch scripts run on the user's own python3, so their tests run on
  # every Python from the oldest the scripts support (ruff.toml's
  # target-version) to the newest release. setup-python uses the runner
  # image's own build of a version when it has one, and downloads the newest
  # patch release when it has not.
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      # The python3 the tests run on must be the one asked for, not the
      # runner's own.
      - name: Python tests
        env:
          WANT: ${{ matrix.python }}
        run: |
          python3 -I -c 'import os, sys; print(sys.version); sys.exit(f"{sys.version_info.major}.{sys.version_info.minor}" != os.environ["WANT"])'
          bash scripts/test.sh python

  # The Python, linted and its formatting checked by the ruff that
  # requirements-dev.txt pins. Nothing here changes a file: the formatting
  # is done before each commit, by scripts/hooks/pre-commit.
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint
        run: bash scripts/ruff.sh check --output-format=github .

      - name: Formatting
        run: bash scripts/ruff.sh format --check --diff .

  # The QML itself, against real Plasma 6 QML modules, which Ubuntu's
  # runners lack: every file must compile (qmllint passes code that does
  # not), and the popup must render offscreen with no QML warning. The
  # screenshots are uploaded.
  #
  # The image is pinned to a build at least a week old, and packages come
  # from Fedora 44's release repository only, not updates. To move the pin,
  # pick a digest a week or more old from
  # https://quay.io/api/v1/repository/fedora/fedora/tag/?specificTag=44&onlyActiveTags=false
  # that registry.fedoraproject.org still serves (skopeo inspect).
  qml:
    runs-on: ubuntu-latest
    container:
      image: registry.fedoraproject.org/fedora@sha256:74e857c33dfb387710b2b1a0203824351a25e9844356af2d1e5792ca2a96129b # 44, built 2026-10-16
    steps:
      - name: Install Plasma's QML modules
        run: |
          dnf -y --repo=fedora --setopt=install_weak_deps=False install \
            git python3 python3-pyside6 qt6-qtdeclarative-devel \
            libplasma plasma5support kf6-kirigami kf6-kcmutils plasma-integration \
            plasma-breeze-common breeze-icon-theme \
            google-noto-sans-fonts google-noto-color-emoji-fonts tzdata

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile every QML file
        run: python3 -I scripts/check-qml.py

      - name: Render the popup, light and dark
        run: |
          python3 -I scripts/render.py screenshots --offline --scheme light
          python3 -I scripts/render.py screenshots --offline --scheme dark

      - name: Drive the settings page
        run: python3 -I scripts/check-settings.py

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: screenshots/
