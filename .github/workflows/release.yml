name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gettext zip \
            qt6-declarative-dev-tools qml6-module-qttest qml6-module-qtquick \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript

      - name: Run tests
        run: bash scripts/test.sh

      - name: Build .plasmoid
        id: build
        run: echo "package=$(bash scripts/package.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag matches metadata.json
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          expected="net.tropism.plasma.aussieweather-${GITHUB_REF_NAME#v}.plasmoid"
          if [ "$(basename "$PACKAGE")" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.json (built $(basename "$PACKAGE"))" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## /     { exit }
            found               { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          cd "$(dirname "$PACKAGE")"
          sha256sum "$(basename "$PACKAGE")" > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$GITHUB_WORKSPACE/release-notes.md" "$(basename "$PACKAGE")" SHA256SUMS
