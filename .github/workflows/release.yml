name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Everything CI checks on main: the tests, the QML compiled and rendered
  # against real Plasma, the translation template. A tag on a commit that
  # fails any of them publishes nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  # Builds with a read-only token: the repository's own scripts run here,
  # and nothing they do can write to the repository or its releases.
  build:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gettext zip

      # Assigned before it is written out: inside echo, a failing
      # package.sh would go unnoticed.
      - name: Build .plasmoid
        id: build
        run: |
          package="$(bash scripts/package.sh)"
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Tag matches metadata.json
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: |
          expected="net.tropism.plasma.aussieweather-${GITHUB_REF_NAME#v}.plasmoid"
          if [ "$(basename "$PACKAGE")" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match metadata.json (built $(basename "$PACKAGE"))" >&2
            exit 1
          fi

      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver " " { found=1; next }
            found && /^## /     { exit }
            found               { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Checksum
        env:
          PACKAGE: ${{ steps.build.outputs.package }}
        run: sha256sum "$(basename "$PACKAGE")" > SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            net.tropism.plasma.aussieweather-*.plasmoid
            SHA256SUMS
            release-notes.md

  # Publishes what build made. It holds the only write token, and runs no
  # code from the repository: no checkout, only gh.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md ./*.plasmoid SHA256SUMS
